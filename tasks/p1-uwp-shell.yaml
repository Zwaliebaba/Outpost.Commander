      - "The frame time is drawn by the HUD and written to the log; m1-vertical-slice/K5's title-bar readout is gone, and K5's notes say where it went and why"
      - "A grep over the whole tree for CreateWindowEx, RegisterClassEx, PeekMessage, DispatchMessage, DefWindowProc, RegisterRawInputDevices, GetRawInputData, SetProcessDpiAwarenessContext, ShowCursor and SetWindowText returns nothing outside OutpostHost and OutpostCapture"
      - "Design/UwpMigration.md's risk table is rewritten as what actually happened, with P1's five answers in it, and every ADR from 013 to 019 has its Measurements section filled in or says which figure is still owed"
      - The owner has played a match against a host on another machine and says so
    verify:
      - python3 Build/CheckProjectFiles.py
      - python3 Build/CheckFormat.py
      - python3 Tools/CheckTaskDag.py
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
    parallel_safe: false
    status: todo
