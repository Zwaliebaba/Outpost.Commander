      - GameClient/App.cpp
      - GameClient/Hud.h
      - GameClient/Hud.cpp
      - GameClient/Operator.h
      - GameClient/Operator.cpp
      - GameClient/Match.h
      - GameClient/Match.cpp
      - GameClient/CameraController.h
      - GameClient/CameraController.cpp
      - GameLogic/StartingBase.h
      - GameLogic/StartingBase.cpp
      - GameClient/GameClient.vcxproj
      - GameClient/GameClient.vcxproj.filters
      - OutpostCommander/OutpostCommander.vcxproj
      - Build/CheckProjectFiles.py
      - Tests/GameClientTests/HudTests.cpp
      - Tests/GameClientTests/MatchTests.cpp
      - Design/ADR/ADR-018-client-server-libraries.md
    acceptance:
      - "GameClient is built on NeuronCore, NeuronClient and GameShared, and BUILT_ON carries the new NeuronClient edge that ADR-018 pre-authorised"
      - "RunWindowed takes a presentation seam and no window type: the client size in physical pixels, a way to say the frame time changed, and a pump that returns false once the user has left. Nothing above the seam names CoreWindow or HWND"
      - "OutpostCommander/LocalHost.{h,cpp} is deleted, and OutpostCommander's reference set is NeuronCore, NeuronClient, GameShared and GameClient - GameLogic and NeuronServer are gone from it (R19)"
      - "F10's menu loses Resume and becomes the quit menu of Interface.md §10 - Back, Leave match, Quit - in the SAME commit that deletes LocalHost, because it is the same fact twice: there is nothing left in this process to pause (ADR-020). The code that froze the pacer goes with it"
