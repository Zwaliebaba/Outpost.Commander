    intent: >
      One constructor beside the one that takes an HWND. CreateSwapChainForCoreWindow is a plain
      COM method on IDXGIFactory2 taking an IUnknown*, so NeuronClient compiles it as an ordinary
      desktop static library and simply never calls it there - which is the whole of why ADR-014's
      boundary works.
    project: NeuronClient
    depends_on: [P0, P1]
    files:
      - NeuronClient/SwapChain.h
      - NeuronClient/SwapChain.cpp
    acceptance:
      - "SwapChain(GraphicsDevice&, IUnknown* coreWindow, width, height) creates a flip-discard chain of three buffers with CreateSwapChainForCoreWindow"
      - "MakeWindowAssociation and DXGI_MWA_NO_ALT_ENTER are gone from that path: there is no HWND and no DXGI full-screen toggle to suppress"
      - "The tearing flag is asked for on the core-window path exactly as P1 found it to behave, and the log says which answer the machine gave"
      - "The HWND constructor still exists and still works, because OutpostCapture does not use either - and a constructor nobody calls is deleted, not kept"
    verify:
      - python3 Build/CheckFormat.py
      - msbuild OutpostCommander.slnx /t:NeuronClient /p:Configuration=Debug /p:Platform=x64 /m
    parallel_safe: true
    status: todo

  - id: P7
    title: Reduce Paths to two roots each executable supplies for itself
    intent: >
      Neuron::Paths asks GetModuleFileNameW and the LOCALAPPDATA environment variable where things
      are; under the app container neither is the right answer, and NeuronCore is shared with two
      console executables that have no package identity. The right owner of the question is the
      process that knows what kind of process it is, so Paths stops asking and starts being told.
    project: NeuronCore
    depends_on: [P4]
    files:
      - NeuronCore/Paths.h
      - NeuronCore/Paths.cpp
      - OutpostHost/Main.cpp
      - OutpostCapture/Main.cpp
      - Build/CheckProjectFiles.py
      - Tests/NeuronCoreTests/PathsTests.cpp
    acceptance:
      - "Paths::SetRoots(contentRoot, userRoot) replaces OverrideForTests, and Paths::ClearRoots stays for the suites; Paths makes no Win32 call at all"
      - "A grep over the six libraries for GetModuleFileName, GetEnvironmentVariable, SHGetKnownFolderPath and GetCurrentPackage returns nothing, and CheckProjectFiles keeps it returning nothing"
      - "ModsDirectory is UserDirectory()/Mods, not beside the executable: the install directory is inside the package and unwritable by anything including the game (ADR-016)"
      - "OutpostHost and OutpostCapture each set their own roots in Main.cpp from GetModuleFileNameW and %LOCALAPPDATA%\\OutpostCommander, and say so in the log"
      - NeuronCoreTests still covers the four directories, now through SetRoots
    verify:
      - python3 Build/CheckProjectFiles.py
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\NeuronCoreTests.dll /Platform:x64
    parallel_safe: false
    status: todo

  - id: P8
    title: Make OutpostCommander a packaged UWP application over a CoreWindow
    intent: >
      The shell itself: an IFrameworkViewSource handed to CoreApplication::Run, an IFrameworkView
      whose SetWindow subscribes the events and whose Run owns the loop, the manifest, the assets
      and package identity. Window.{h,cpp} and RawMouse.{h,cpp} are deleted - 457 lines - and the
      mouse's relative counts come from MouseDevice::MouseMoved, which is the closest mapping in the
      whole migration.
    project: OutpostCommander
    depends_on: [P1, P3, P5, P6, P7]
    files:
      - OutpostCommander/Main.cpp
      - OutpostCommander/ViewSource.h
      - OutpostCommander/ViewSource.cpp
      - OutpostCommander/FrameworkView.h
      - OutpostCommander/FrameworkView.cpp
      - OutpostCommander/Package.appxmanifest
      - OutpostCommander/OutpostCommander.vcxproj
      - OutpostCommander/OutpostCommander.vcxproj.filters
      - NeuronClient/Window.h
      - NeuronClient/Window.cpp
      - NeuronClient/RawMouse.h
      - NeuronClient/RawMouse.cpp
      - NeuronClient/NeuronClient.vcxproj
      - Design/ADR/ADR-013-uwp-application-model.md
    acceptance:
      - "The game builds as an MSIX, deploys, launches full screen through ApplicationView::TryEnterFullScreenMode, draws the match and takes input - RUN AND LOOKED AT, not merely built (AGENTS.md §3)"
      - "CoreDispatcher::ProcessEvents(ProcessAllIfPresent) is called once per frame and nowhere else, and enqueues into the same Neuron::InputQueue the window procedure enqueued into"
      - "Aim mode hides the cursor with CoreWindow::PointerCursor = nullptr and turns the camera on MouseDevice::MouseMoved's MouseDelta; the sign of both axes is checked against NeuronClient/PointerMode.h's rule by moving the mouse and looking"
      - "Escape peels as Design/Interface.md §7 says and calls CoreApplication::Exit only on the last press; CoreWindow::Closed is honoured wherever it comes from"
      - "GameData ships in the package as DeploymentContent and is read from Package::Current().InstalledLocation(); the user's directory is ApplicationData::Current().LocalFolder(); both are handed to Paths::SetRoots (ADR-016)"
      - "--warp and --novsync arrive through LaunchActivatedEventArgs::Arguments() and are proved to work from the debugger's arguments property - or ADR-016 records that they do not and they move to a file in LocalState"
      - "NeuronClient/Window.{h,cpp} and NeuronClient/RawMouse.{h,cpp} are deleted, and no .xaml exists anywhere in the tree (R18)"
    verify:
      - python3 Build/CheckProjectFiles.py
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - Add-AppxPackage -Register OutpostCommander\bin\x64\Debug\AppX\AppxManifest.xml
    parallel_safe: false
    status: todo

  - id: P9
    title: Size the swap chain in physical pixels, and prove it at three scale factors
    intent: >
      The one place this migration can silently produce a worse picture. A swap chain created at
      CoreWindow::Bounds on a 3840x2160 panel at 150% would be 2560x1440, FitAuthored would take the
      bilinear path from a 1920x1080 scene target, and the compositor would scale that again - two
      resamples where AGENTS.md §5 asks for a point-sampled 2x. Nothing fails, nothing logs, and no
      test catches it, which is why the acceptance here is numbers and a picture rather than a
      green build.
    project: OutpostCommander
    depends_on: [P8]
    files:
      - OutpostCommander/FrameworkView.cpp
      - NeuronClient/DisplayPixels.cpp
      - Design/ADR/ADR-017-core-window-pixels-and-lifetime.md
    acceptance:
      - "ApplicationViewScaling::TrySetDisableLayoutScaling(true) is called before the first frame, and the log says whether it succeeded and what the window then reported"
      - "At 100%, 150% and 200% on one panel, the log records four numbers each: the window's reported size, the DPI, the swap chain's size, and which branch of FitAuthored ran. All three are recorded in ADR-017's Measurements"
      - "A screenshot at 1:1 is pixel-exact against a capture frame: the interface's small type is unresampled, which is what the whole arrangement exists to protect (ADR-004)"
      - "DpiChanged, DisplayContentsInvalidated and CoreWindow::SizeChanged all reach the same recompute-and-resize path, and dragging the window between two monitors of different scale is looked at"
      - The manifest declares landscape orientations only, and no pre-rotation path is written
    verify:
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
    parallel_safe: false
    status: todo

  - id: P10
    title: Survive suspend, resume and device removal
    intent: >
      The largest piece of genuinely new work in this plan, and the only one whose failure mode is a
      crash rather than a wrong picture. A grep over NeuronClient for DXGI_ERROR_DEVICE_REMOVED
      returns nothing today: a desktop game that runs until the player leaves can get away with
      that, and one the system parks and wakes cannot.
    project: OutpostCommander
    depends_on: [P8]
    files:
      - OutpostCommander/FrameworkView.cpp
      - NeuronClient/GraphicsDevice.h
      - NeuronClient/GraphicsDevice.cpp
      - NeuronClient/SwapChain.cpp
      - NeuronClient/SceneTarget.cpp
    acceptance:
      - "CoreApplication::Suspending takes its deferral, waits for the GPU to go idle, calls IDXGIDevice3::Trim and completes the deferral; the app survives a suspend and a resume with the match intact"
      - "The frame loop stops presenting when CoreWindow::VisibilityChanged says the window is not visible, and starts again when it is - checked by minimising and restoring"
      - "Present and BeginFrame detect DXGI_ERROR_DEVICE_REMOVED and DXGI_ERROR_DEVICE_RESET, log GetDeviceRemovedReason, and rebuild the device, the swap chain, the scene target and all seven pipeline states"
      - "Device removal is PROVOKED deliberately - the debug layer's device-removal injection on WARP - and the game recovers and keeps drawing the same match, because the simulation holds no graphics state"
    verify:
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
    parallel_safe: false
    status: todo

