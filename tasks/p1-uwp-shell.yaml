      because it lives in an Application - and under ADR-014 the packaged project holds Windows
      Runtime glue and nothing else. The frame assembly, the camera controller, the HUD, the
      operator and the match go down into GameClient; the starting base goes to GameLogic;
      LocalHost is DELETED rather than moved, because ADR-019 says the client never simulates.
    project: GameClient
    depends_on: [P2]
    files:
