  - id: P5
    title: Write the translation the shell will need, as pure functions with a suite
    intent: >
      The three pieces of the shell a compiler and a test runner can hold: the conversion from the
      core window's device-independent pixels to physical ones, the VirtualKey to key-code mapping,
      and the pointer-event to InputEvent translation. None needs a package to build or a window to
      test, and each is one character away from a defect no compiler will notice - which is the
      argument NeuronClient/PointerMode.h already makes about the sign of an aim delta.
    project: NeuronClient
    depends_on: [P0, P1]
    files:
      - NeuronClient/DisplayPixels.h
      - NeuronClient/DisplayPixels.cpp
      - NeuronClient/KeyMap.h
      - NeuronClient/KeyMap.cpp
      - NeuronClient/NeuronClient.vcxproj
      - NeuronClient/NeuronClient.vcxproj.filters
      - Tests/NeuronClientTests/DisplayPixelsTests.cpp
      - Tests/NeuronClientTests/KeyMapTests.cpp
    acceptance:
      - "PhysicalPixels(dips, logicalDpi) rounds as the platform documents - floor(dips * dpi / 96 + 0.5) - and names no Windows Runtime type"
      - "NeuronClientTests pins it at 96, 120, 144 and 192 DPI against 1920x1080, 2560x1440 and 3840x2160, and pins that the 1:1 and integer-multiple cases of AGENTS.md §5 are reached where they should be"
      - "The key map turns a VirtualKey into the same key code the window procedure produced, so that every input test written before this migration still means what it meant"
      - "Neither file includes winrt/ anything: the translation is arithmetic over integers, and the shell hands it the integers"
    verify:
      - python3 Build/CheckProjectFiles.py
      - msbuild OutpostCommander.slnx /t:NeuronClient /p:Configuration=Debug /p:Platform=x64 /m
      - vstest.console.exe x64\Debug\NeuronClientTests.dll /Platform:x64
    parallel_safe: true
    status: todo

