      The capture gate is the strongest quality mechanism this tree has - four assertions over a
      9,000-tick scripted match - and App::RunCapture has no window and no swap chain, so packaging
      it buys nothing and risks all four. It becomes a console executable that links both sides over
      LoopbackTransport, and CI's capture step changes one word.
    project: OutpostCapture
    depends_on: [P3]
    files:
      - OutpostCapture/Main.cpp
      - OutpostCapture/Capture.h
      - OutpostCapture/Capture.cpp
      - OutpostCapture/pch.h
      - OutpostCapture/pch.cpp
      - OutpostCapture/OutpostCapture.vcxproj
      - OutpostCapture/OutpostCapture.vcxproj.filters
      - OutpostCommander.slnx
      - Build/CheckProjectFiles.py
      - .github/workflows/build.yml
    acceptance:
      - "OutpostCapture --warp --capture Slice 9000 Captures writes the same frames and the same capture.log the game wrote, and exits with the same three codes"
      - "CI's capture step names OutpostCapture.exe and is otherwise unchanged: all four assertions - a shot in flight, at least a hundred interface quads a frame, a device selected, something researched - pass verbatim"
      - "--capture is gone from OutpostCommander entirely; a flag that cannot be reached is worse than no flag (ADR-016)"
      - "BUILT_ON carries OutpostCapture with the whole table as its edge set, and the comment says it is a harness that never ships"
    verify:
      - python3 Build/CheckProjectFiles.py
