# Schema: Design/ImplementationPlan.md §3    Validate: python3 Tools/CheckTaskDag.py tasks/p1-uwp-shell.yaml
# The narrative this schedules is Design/UwpMigration.md; the decisions are ADR-013 to ADR-019.

plan: p1-uwp-shell
title: Run the game as a packaged UWP application over a CoreWindow, with the client holding no simulation
phase: 1
summary: >
  A letter rather than a milestone number, because this plan cuts across the milestones instead of
  following them. When it is finished: OutpostCommander is an MSIX-packaged UWP application whose
  view is a CoreWindow, it links no GameLogic, the headless capture CI depends on runs from its own
  console executable, and a grep over the tree for the Win32 window entry points returns nothing.
  P1 comes first and alone: it measures five things this plan assumes and cannot check any other
  way, and the plan changes shape if any of them answers wrong.

tasks:
  - id: P0
    title: Compile the restructured tree, and fix what only a compiler can find
    intent: >
      ADR-018 moved roughly 300 files and rewrote fifteen project files with no MSVC in reach.
      CheckProjectFiles verified every edge, every reference, every include directory and every
      quoted include against the layering table, and CheckFormat and the plan validator are green -
      but nothing has been compiled or linked. This is the first task that does, and it comes before
      the refactor in P2 for a plain reason: debugging a signature change and a file move at the
      same time is two problems wearing one hat.
    project: OutpostCommander
    depends_on: []
    files:
      - NeuronCore/NeuronCore.vcxproj
      - NeuronClient/NeuronClient.vcxproj
      - NeuronServer/NeuronServer.vcxproj
      - GameShared/GameShared.vcxproj
      - GameClient/GameClient.vcxproj
      - GameLogic/GameLogic.vcxproj
      - OutpostCommander/OutpostCommander.vcxproj
      - OutpostHost/OutpostHost.vcxproj
      - Design/ADR/ADR-018-client-server-libraries.md
    acceptance:
      - "The solution builds Debug|x64 clean with warnings as errors, all fifteen projects, from a
        fresh clone - no stale x64/ directory to hide a missing file"
      - "Every one of the seven suites produces a DLL and vstest runs them all green; a suite that
        did not build is not a suite that passed"
      - "The Release|x64 build is done once by hand as well, because CI does not do it and the
        restructure changed every project file (AGENTS.md §3)"
      - "GameShared/VictoryState.h is reached by everything that used to reach Victory.h for the
        enum, and nothing links Victory.cpp from the client side"
      - "Each of the seven precompiled headers still includes the right library's pch.h: they were
        copied and rewritten by path, not by a compiler"
      - "ADR-018's Measurements section loses the sentence saying the tree is unbuilt, and records
        what the compiler found instead - including nothing, if it found nothing"
    verify:
      - python3 Build/CheckProjectFiles.py
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - msbuild OutpostCommander.slnx /p:Configuration=Release /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
      - python3 Build\RunClangTidy.py
    parallel_safe: false
    status: todo

  - id: P1
    title: Prove the ground before anything is built on it
    intent: >
      Every platform claim in ADR-013 to ADR-017 is read from Microsoft's documentation and none is
      confirmed against a compiler, because the tree that wrote them had no Windows machine in
      reach. This is a throwaway UWP project that opens a core window, makes a D3D12 device,
      creates a swap chain for it, clears to a colour and presents - and answers five questions. It
      is a day of work that can save a fortnight, and nothing else in this plan may start until it
      has run.
    project: OutpostCommander
    depends_on: []
    files:
      - Design/ADR/ADR-013-uwp-application-model.md
      - Design/ADR/ADR-015-cppwinrt-dependency.md
      - Design/ADR/ADR-017-core-window-pixels-and-lifetime.md
      - Design/ADR/ADR-019-the-client-never-simulates.md
    acceptance:
      - "The spike builds at ApplicationType=Windows Store with v145 and the tree's whole setting block: /std:c++latest, /permissive-, /W4 with warnings as errors, /fp:precise, /arch:AVX2. The exact toolset component and its version are recorded in ADR-013's Measurements"
      - "The /std: switch on the compiler command line is read out of the BUILD LOG, not inferred from the build succeeding: the Microsoft.Windows.CppWinRT package documents setting stdcpp17, and ADR-015 overrides it back. The package version is pinned and written into ADR-015"
      - "/await is absent from the command line once the property is cleared, or ADR-015 records why it could not be; the switch is deprecated as of Visual Studio 2026 and slated for removal"
      - "The generated winrt/*.h projection headers compile at /W4 with warnings as errors, or the exact warning numbers are recorded and the /external: answer is scoped to the generated-projection directory alone - never a lowered warning level, never a pragma (AGENTS.md §4)"
      - "DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING is accepted at CREATION on a core-window chain, in ApplicationView::TryEnterFullScreenMode, and Present(0, DXGI_PRESENT_ALLOW_TEARING) returns S_OK - or ADR-013 records that it is not, and the frame time moves to GPU timestamp queries"
      - "Whether the GitHub windows-latest image carries Microsoft.VisualStudio.ComponentGroup.UWP.VC is established by running vswhere in a throwaway workflow. If it does not, ADR-016's package gate is answered with a workload install step, a pinned image, or an entry in AGENTS.md §3 saying the package is a local gate"
      - "The DEVELOPMENT loopback path is confirmed on a machine, which is the only loopback path the tree needs: a packaged client reaches an unpackaged listener on 127.0.0.1 with the exemption, and fails without it. The failing half matters more than the passing half - it is what stops a same-machine build being mistaken for a shipping one (ADR-019)"
      - "The spike is deleted in the same commit that records the answers. It is a measurement, not a foundation"
    verify:
      - msbuild <spike>.slnx /p:Configuration=Debug /p:Platform=x64 /m /v:normal /flp:LogFile=spike.log
      - Select-String -Path spike.log -Pattern '/std:|/await|/external:'
    parallel_safe: true
    status: todo

  - id: P2
    title: Tighten the shared boundary, so the client cannot name the world
    intent: >
      ADR-018 split the tree correctly at the project level and loosely at the header level:
      GameShared holds 19 headers that came out of Sim, World.h and StateHash.h among them, and the
      client has no business with either. Three includes put them there. This removes all three, and
      the eight headers behind them go back to GameLogic.
    project: GameShared
    depends_on: [P0]
    files:
      - GameShared/Placement.h
      - GameShared/Placement.cpp
      - GameShared/Landscape.h
      - GameShared/Landscape.cpp
      - GameLogic/StateHash.h
      - GameLogic/StateHash.cpp
      - GameShared/GameShared.vcxproj
      - GameShared/GameShared.vcxproj.filters
      - GameLogic/GameLogic.vcxproj
      - GameLogic/GameLogic.vcxproj.filters
      - Tests/GameSharedTests/PlacementTests.cpp
      - Tests/GameLogicTests/LandscapeTests.cpp
    acceptance:
      - "Placement takes the landscape, the footprint and an occupancy view rather than a World&, so Placement.h no longer includes World.h; the placement preview and the host's validation still call the same function, which is what makes the preview honest"
      - "Landscape.h no longer includes StateHash.h: the landscape's contribution to the state hash is a free function on the side that hashes, and World.h, StateHash.h, Seat.h, GhostStore.h, Projectile.h, Wreck.h and Feature.h are GameLogic's again"
      - "A grep over GameClient and GameShared for World.h, StateHash.h, Sim.h, Seat.h, GhostStore.h, Projectile.h and Wreck.h returns nothing"
      - "GameSharedTests covers the placement rule directly, without constructing a Sim"
      - The determinism tests still pass bit for bit; the state hash covers the same bytes in the same order (ADR-002)
    verify:
      - python3 Build/CheckProjectFiles.py
      - python3 Build/CheckFormat.py
      - msbuild OutpostCommander.slnx /p:Configuration=Debug /p:Platform=x64 /m /warnaserror
      - vstest.console.exe x64\Debug\*Tests.dll /Platform:x64
    parallel_safe: true
    status: todo

