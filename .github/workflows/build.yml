name: Build

# CI for Outpost Commander (AGENTS.md section 6).
#
# ── What this builds, and what it deliberately does not ────────────────────────────────────────
#
# DEBUG|X64 ONLY, by the owner's decision. The Windows build is the slow half of the pipeline and
# each extra pair roughly doubles it.
#
# BE HONEST ABOUT WHAT THAT LEAVES UNGATED, because it is not nothing:
#
#   RELEASE. AGENTS.md section 3 requires every setting that is not about optimization to read
#   identically in the two configurations, and no checker in this tree asserts it. Nothing here
#   compiles Release, so a Release that quietly lost an include directory, sat on an older language
#   standard, or breaks only under optimization reaches main green. It is caught by whoever builds
#   Release before shipping -- see AGENTS.md section 3 and the pull request checklist.
#
#   ARM64. The client is a packaged application for a device that may well be one. Nothing here
#   builds it, so an ARM64-only break -- most plausibly something that assumes x86-family
#   intrinsics, since EnableEnhancedInstructionSet is the one setting that differs by platform --
#   reaches main green too.
#
# The cheap half of both is now closed by the `static checks` job below: Scripts/CheckProjectFiles.py
# asserts section 3's table over every project file in about a second, so a setting that drifted into
# a configuration-conditioned group, a lowered language standard or a platform that inherits
# EnableEnhancedInstructionSet is caught here rather than by whoever ships. IT STILL COMPILES
# NOTHING. A Release that breaks only under optimization, or an ARM64 that assumes an x86 intrinsic,
# reaches main green exactly as before -- configuration drift is what closed, not the platforms.
#
# ── What is not pinned, and what is ────────────────────────────────────────────────────────────
#
# PlatformToolset is pinned in the project files to v145. The runner image is not: it is whatever
# GitHub ships, and a wrong image pin trades a floating toolchain for a build that does not run at
# all. So the first step verifies that the toolset and the Windows Store application type are
# actually on the runner and fails with a message that names what is missing -- rather than leaving
# a wall of MSBuild errors to be read. It also prints what it got, so a pin can be taken from
# evidence the day one is wanted.
#
# clang-format IS pinned, and comes from pip rather than from the image: two major versions break a
# long argument list in different places, so a floating version would turn main red on code that
# had not changed. From pip because that is the only way a developer can run the same binary the
# gate runs -- `python -m pip install clang-format==<this>` gets it on any machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug|x64
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CONFIGURATION: Debug
      PLATFORM: x64

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add NuGet to PATH
        uses: NuGet/setup-nuget@v2

      # FIRST, and loud. Every project pins PlatformToolset v145, and OutpostCommander is a
      # packaged UWP application, so the job needs two things the runner image may not carry:
      # Visual Studio 2026 with the v145 toolset, and the "Universal Windows Platform development"
      # workload that supplies the Windows Store application type. Without them MSBuild fails deep
      # inside a target with a message about a missing .props file, which is a bad way to find out.
      - name: Verify the toolchain
        shell: pwsh
        run: |
          Write-Output "runner image : $env:ImageOS / $env:ImageVersion"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe is not on this runner, so no Visual Studio installation can be found." }
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw "vswhere found no Visual Studio installation on this runner." }
          $version = & $vswhere -latest -products * -property installationVersion
          Write-Output "visual studio: $install ($version)"
          msbuild -version -nologo

          $missing = @()

          # What IS here, before what is not: a message that names only the gap leaves the reader
          # guessing whether the image is one component short or a whole Visual Studio behind.
          $toolsets = @(Get-ChildItem -Path "$install\MSBuild\Microsoft\VC" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem -Path "$($_.FullName)\Platforms\$env:PLATFORM\PlatformToolsets" -Directory -ErrorAction SilentlyContinue } |
            Select-Object -ExpandProperty Name | Sort-Object -Unique)
          Write-Output "toolsets     : $($toolsets -join ', ')"

          $desktop = @(Get-ChildItem -Path "$install\MSBuild\Microsoft\VC" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "Platforms\$env:PLATFORM\PlatformToolsets\v145" } |
            Where-Object { Test-Path $_ })
          if ($desktop.Count -eq 0) {
            $missing += "the v145 platform toolset for $env:PLATFORM (Visual Studio 2026, workload 'Desktop development with C++')"
          }
          else { Write-Output "v145 desktop : $($desktop[0])" }

          $store = @(Get-ChildItem -Path "$install\MSBuild\Microsoft\VC" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "Application Type\Windows Store\10.0\Platforms\$env:PLATFORM\PlatformToolsets\v145" } |
            Where-Object { Test-Path $_ })
          if ($store.Count -eq 0) {
            $missing += "the Windows Store 10.0 application type for $env:PLATFORM (workload 'Universal Windows Platform development', with its C++ component)"
          }
          else { Write-Output "v145 uwp     : $($store[0])" }

          # The Windows SDK the project files ask for, read FROM them rather than repeated here, so
          # this cannot drift from what they pin. A bare "10.0" means "whatever is newest" and is
          # always satisfiable; an exact version has to actually be installed, and when it is not,
          # MSBuild's own complaint is several layers deep in a target.
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $installed = @(Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Sort-Object)
          Write-Output "windows sdks : $($installed -join ', ')"
          $pinned = @(Get-ChildItem -Path . -Recurse -Filter '*.vcxproj' -File |
            ForEach-Object { Select-Xml -Path $_.FullName -XPath '//*[local-name()="WindowsTargetPlatformVersion"]' } |
            ForEach-Object { $_.Node.InnerText } | Sort-Object -Unique)
          Write-Output "sdks pinned  : $($pinned -join ', ')"
          foreach ($want in $pinned) {
            if ($want -eq '10.0') { continue }
            if ($installed -notcontains $want) {
              $missing += "the Windows SDK $want, which the project files pin (installed here: $($installed -join ', '))"
            }
          }

          if ($missing.Count -gt 0) {
            $lines = $missing | ForEach-Object { "  - $_" }
            throw "This runner cannot build Outpost Commander. Missing:`n$($lines -join "`n")`n" +
                  "The toolset and the SDK are pinned in the project files (AGENTS.md section 3) and are not something " +
                  "to work around by lowering them on the quiet. Either this job installs what is missing, or the build " +
                  "needs a runner that already has it -- and if the pin itself is wrong, change it in the project files " +
                  "deliberately, not here."
          }

      # The solution is found, not named: exactly one .slnx or .sln at the repository root.
      - name: Locate the solution
        id: solution
        shell: pwsh
        run: |
          $found = @(Get-ChildItem -Path . -File | Where-Object { $_.Extension -in '.slnx', '.sln' })
          if ($found.Count -ne 1) { throw "Expected exactly one solution at the repository root; found $($found.Count)." }
          Write-Output "Solution: $($found[0].Name)"
          "path=$($found[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The five C++/WinRT projects each reference Microsoft.Windows.CppWinRT through a
      # packages.config, and the packages folder is not committed. nuget.exe does not read .slnx,
      # so the configs are found rather than named -- adding a sixth project does not mean
      # remembering to edit this file. They all pin the same version, so this restores one copy.
      - name: Restore the NuGet packages
        shell: pwsh
        run: |
          $configs = @(Get-ChildItem -Path . -Recurse -Filter 'packages.config' -File)
          if ($configs.Count -eq 0) { Write-Output "::notice::No packages.config in the tree."; exit 0 }
          foreach ($config in $configs) {
            Write-Output "restoring $($config.FullName.Replace("$PWD\", ''))"
            nuget restore $config.FullName -PackagesDirectory packages -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "nuget restore failed for $($config.Name)." }
          }

      # /warnaserror covers MSBuild's own warnings; /WX for the compiler is set in every project.
      - name: Build
        shell: pwsh
        run: |
          msbuild "${{ steps.solution.outputs.path }}" `
            /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM `
            /m /nologo /v:minimal /warnaserror `
            /flp:LogFile=build.log`;Verbosity=normal

      # One suite per *Tests.vcxproj in the tree, and every one of them must have produced a DLL.
      # vstest reports "no tests found" as a pass, so a suite that did not build is not a suite that
      # passed -- and neither is a suite with no tests in it, which is why every one ships a
      # SuiteSmoke placeholder (AGENTS.md section 3).
      - name: Check that every suite was built
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path . -Recurse -Filter '*Tests.vcxproj' -File)
          if ($projects.Count -eq 0) { throw "No *Tests.vcxproj in the tree. Every library has a suite (AGENTS.md section 2)." }
          foreach ($project in $projects) {
            $dll = "$env:PLATFORM\$env:CONFIGURATION\$($project.BaseName).dll"
            if (-not (Test-Path $dll)) { throw "$dll was not built. A suite that does not exist is not a suite that passed." }
            Write-Output "built: $dll"
          }

      - name: Run the tests
        shell: pwsh
        run: |
          $suites = @(Get-ChildItem -Path . -Recurse -Filter '*Tests.vcxproj' -File |
            ForEach-Object { "$env:PLATFORM\$env:CONFIGURATION\$($_.BaseName).dll" })
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found." }
          # The console logger at detailed verbosity prints what a test wrote (Logger::WriteMessage)
          # for passed tests too, which is how a measurement a test makes reaches a reader of this
          # log rather than only the TestResults artifact.
          & $vstest $suites /Platform:x64 /Logger:trx /Logger:"console;verbosity=detailed" /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "vstest reported failures." }

      - name: Check that every suite ran a test
        shell: pwsh
        # vstest scores "no tests found" as a PASS, so the step above -- which proves each suite was
        # BUILT -- leaves an empty suite as a green check mark over a library nobody exercised.
        run: python Scripts/CheckSuites.py TestResults

      - name: Naming, via clang-tidy (report only)
        shell: pwsh
        continue-on-error: true
        # NOT A GATE, deliberately. .clang-tidy has never been driven over this tree, clang is not
        # MSVC, and /std:c++latest is ahead of what clang implements -- so a parse error here is a
        # clang limitation rather than a defect. Read the output. Once this has run clean on the
        # runner, pass -Gate and drop continue-on-error, in a pull request that says it did so.
        run: pwsh Scripts/RunClangTidy.ps1

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Linux, and parallel to the Windows build, because all three read files rather than compile:
    # they finish in about a second and report before a build would have started linking. Between
    # them they close three of the gaps the header above names -- Release and ARM64 configuration
    # drift, R16, and figures that disagree between documents -- without costing a second build.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Project files agree with AGENTS.md section 3
        # The cheap half of what building Release|x64, Debug|ARM64 and Release|ARM64 would have
        # caught: a setting that drifted into a configuration-conditioned group, a lowered language
        # standard, a platform that inherits EnableEnhancedInstructionSet, an SDK pin past the
        # runner's. It cannot catch a break in CODE -- only in configuration.
        run: python3 Scripts/CheckProjectFiles.py

      - name: The simulation obeys R16
        # A float in GameCore, an unordered container, a wall-clock read, an unpinned PRNG. Each
        # compiles and passes every test; each surfaces as an x64-against-ARM64 desync months later.
        run: python3 Scripts/CheckDeterminism.py

      - name: US spelling, in prose and identifiers alike
        # R11's rule since day one for identifiers, extended to prose on 2026-09-21 and enforced
        # by anything for the first time. It found a weapon identity in the catalog still spelled
        # the British way, which is how long an unenforced naming rule survives.
        run: python3 Scripts/CheckSpelling.py

      - name: The design documents agree
        # A figure here is stated in three places by design. When one moves and the others do not,
        # both copies read as authoritative. This has happened repeatedly.
        run: python3 Scripts/CheckDesign.py

      - name: The HUD geometry obeys its own rules
        # Every interactive rect at its 48/64/96 tier with 16px of clear space, in BOTH handedness
        # states, plus the frame and tier figures geometry.json copies out of Interface.md section 1.
        # CheckDesign.py reads Design/*.md and never reaches into that JSON, so without this a tier
        # that moves in the prose leaves a copy in the handoff still reading as authoritative.
        run: python3 Scripts/CheckHudGeometry.py

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Its own Linux job, and not a step on the Windows one, because it is seconds rather than
    # minutes: it reports a formatting problem long before a build would have.
    env:
      CLANG_FORMAT_VERSION: 23.1.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned clang-format
        run: python3 -m pip install --disable-pip-version-check "clang-format==$CLANG_FORMAT_VERSION"

      - name: Check formatting
        run: |
          clang-format --version
          files=$(git ls-files '*.cpp' '*.h')
          if [ -z "$files" ]; then echo "No C++ in the tree."; exit 0; fi
          # --Werror turns a difference into a non-zero exit; --dry-run writes nothing.
          # `python -m pip install clang-format==<the version above>` then
          # `clang-format -i <file>` is how to fix what this reports.
          echo "$files" | xargs clang-format --dry-run --Werror
